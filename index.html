<style>
/* General page styling */
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Header */
header {
    padding: 20px;
}

/* Navigation menu */
.navbar {
    display: flex;
    background-color: #333;
}

/* Navigation links */
.navbar a,
.subnavbtn {
    color: white;
    padding: 14px 16px;
    font-size: 16px;
    text-decoration: none;
}

/* Subnavigation */
.subnav {
    position: relative;
}

/* Subnavigation button */
.subnavbtn {
    border: none;
    background-color: inherit;
    font-family: inherit;
    cursor: pointer;
}

/* Hover effects */
.navbar a:hover,
.subnav:hover .subnavbtn,
.subnav:focus-within .subnavbtn {
    background-color: red;
}

/* Dropdown menu */
.subnav-content {
    display: none;
    position: absolute;
    left: 0;
    top: 100%;
    min-width: 250px;
    background-color: red;
    z-index: 10;
}

/* Dropdown links */
.subnav-content a {
    display: block;
    padding: 12px 16px;
}

/* Dropdown hover */
.subnav-content a:hover {
    background-color: #eee;
    color: black;
}

/* Show dropdown */
.subnav:hover .subnav-content,
.subnav:focus-within .subnav-content {
    display: block;
}

/* Footer */
footer {
    margin-top: 40px;
    padding: 20px;
}

/* Mobile layout */
@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
    }

    .subnav-content {
        position: static;
        width: 100%;
    }

    .navbar a,
    .subnavbtn {
        display: block;
        width: 100%;
        text-align: left;
        box-sizing: border-box;
    }
}

</style>

    
</head>
